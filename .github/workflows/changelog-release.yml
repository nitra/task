# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Автоматичний реліз із change-файлів: merge у main з {app,owner,delta}/.changes/*.md →
# `n-cursor release` (бамп version + CHANGELOG.md + коміт "release: app@X, owner@Y,
# delta@Z" + теги app@X/owner@Y/delta@Z) → dispatch release.yml / release-owner.yml /
# release-delta.yml (--ref app@X / owner@Y / delta@Z) на DMG-артефакти. Пуш тегів
# робиться GITHUB_TOKEN-ом і не тригерить workflows, тому build-workflow викликається
# явно через workflow_dispatch.
# Один тег на продукт-реліз (app@X.Y.Z / owner@X.Y.Z / delta@X.Y.Z) — він же
# changelog-якір, він же build-тригер; окремі vX/owner-vX теги (стара схема) більше не
# створюються.

name: Changelog Release

on:
  push:
    branches:
      - main
    paths:
      - 'app/.changes/**'
      - 'owner/.changes/**'
      - 'delta/.changes/**'

  workflow_dispatch: {}

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  release:
    # Страховка від циклу при ручному пуші release-коміту (він теж матчить
    # paths, бо видаляє change-файли); пуші від GITHUB_TOKEN не тригерять і так.
    if: "!startsWith(github.event.head_commit.message, 'release:')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun-deps
      - name: Configure git identity + push auth
        run: >-
          git config user.name "github-actions[bot]"

          git config user.email "github-actions[bot]@users.noreply.github.com"

          git remote set-url origin "https://x-access-token:${{
          secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

      - name: Run n-cursor release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npx n-cursor release

      - name: Detect produced release
        id: rel
        run: |
          SUBJ=$(git log -1 --pretty=%s)
          if ! echo "$SUBJ" | grep -q '^release:'; then
            echo "no pending change files — nothing released"
            exit 0
          fi
          # Суб'єкт "release: app@X, owner@Y, delta@Z" — межа слова відсікає owner@/delta@ від app@.
          if echo "$SUBJ" | grep -qE '(^release: |[ ,])app@'; then
            APP=$(node -p "require('./app/package.json').version")
            echo "app=$APP" >> "$GITHUB_OUTPUT"
            echo "released app@$APP"
          fi
          if echo "$SUBJ" | grep -qE '(^release: |[ ,])owner@'; then
            OWNER=$(node -p "require('./owner/package.json').version")
            echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
            echo "released owner@$OWNER"
          fi
          if echo "$SUBJ" | grep -qE '(^release: |[ ,])delta@'; then
            DELTA=$(node -p "require('./delta/package.json').version")
            echo "delta=$DELTA" >> "$GITHUB_OUTPUT"
            echo "released delta@$DELTA"
          fi

      - name: Tag and push
        if: steps.rel.outputs.app || steps.rel.outputs.owner || steps.rel.outputs.delta
        env:
          APP_VER: ${{ steps.rel.outputs.app }}
          OWNER_VER: ${{ steps.rel.outputs.owner }}
          DELTA_VER: ${{ steps.rel.outputs.delta }}
        run: |
          TAGS=()
          if [ -n "$APP_VER" ]; then
            git tag "app@$APP_VER" 2>/dev/null || true
            TAGS+=("refs/tags/app@$APP_VER")
          fi
          if [ -n "$OWNER_VER" ]; then
            git tag "owner@$OWNER_VER" 2>/dev/null || true
            TAGS+=("refs/tags/owner@$OWNER_VER")
          fi
          if [ -n "$DELTA_VER" ]; then
            git tag "delta@$DELTA_VER" 2>/dev/null || true
            TAGS+=("refs/tags/delta@$DELTA_VER")
          fi
          git push origin HEAD:main "${TAGS[@]}"

      - name: Dispatch DMG release build (app)
        if: steps.rel.outputs.app
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.rel.outputs.app }}
        run: gh workflow run release.yml --ref "app@$VER"

      - name: Dispatch DMG release build (owner)
        if: steps.rel.outputs.owner
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.rel.outputs.owner }}
        run: gh workflow run release-owner.yml --ref "owner@$VER"

      - name: Dispatch DMG release build (delta)
        if: steps.rel.outputs.delta
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.rel.outputs.delta }}
        run: gh workflow run release-delta.yml --ref "delta@$VER"
