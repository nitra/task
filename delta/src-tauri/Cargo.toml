[package]
name = "delta"
version = "0.1.0"
description = "Delta App desktop — mandate map, quiz-gated decisions (M0: read-only mandate map)"
authors = ["nitra"]
edition = "2021"

[lib]
name = "delta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"

[dev-dependencies]
tempfile = "3"
