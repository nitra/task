[package]
name = "delta"
version = "0.1.0"
description = "Delta App desktop — mandate map, quiz-gated decisions (M0: read-only mandate map)"
authors = ["nitra"]
edition = "2021"

[lib]
name = "delta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri-plugin-process = "2.3.1"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
delta-core = { path = "../crates/delta-core" }
delta-fs-io = { path = "../crates/delta-fs-io" }
mt-mandates = { git = "https://github.com/nitra/mt-rust.git", rev = "83e1555512520fd820b97025383f6c321bc09bb6" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

[dev-dependencies]
tempfile = "3"
