[package]
name = "delta-cli"
version = "0.1.0"
description = "Delta App CLI (фаза A) — Rust-бінарник для tools мандатів/decisions/квіз-гейта/кворуму/mandate-change, лінкує delta-core"
edition = "2021"
publish = false

[[bin]]
name = "delta"
path = "src/main.rs"

[dependencies]
delta-core = { path = "../delta-core" }
delta-fs-io = { path = "../delta-fs-io" }
mt-mandates = { git = "https://github.com/nitra/mt-rust.git", rev = "83e1555512520fd820b97025383f6c321bc09bb6" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
async-trait = "0.1"
