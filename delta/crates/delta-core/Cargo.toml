[package]
name = "delta-core"
version = "0.1.0"
description = "Delta App — гейт-ядро (фаза A): мандати/decisions/quiz/signing/quorum, спільне для GUI (Tauri) і CLI"
edition = "2021"
publish = false

[lib]
name = "delta_core"

[dependencies]
mt-mandates = { git = "ssh://git@github.com/nitra/mt-rust.git", rev = "83e1555512520fd820b97025383f6c321bc09bb6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
ed25519-dalek = "3"
getrandom = "0.3"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"

[dev-dependencies]
